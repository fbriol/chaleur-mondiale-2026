name: Reproduire la figure
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  figure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python plot_temperature.py
      - uses: actions/upload-artifact@v4
        with:
          name: figure
          path: |
            temperature-mondiale-2026.png
            data/
      - name: Enregistrer la figure et les données dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temperature-mondiale-2026.png data/
          git diff --cached --quiet || git commit -m "chore(data): régénère la figure depuis les données Copernicus"
          git push
